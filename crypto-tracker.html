<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Crypto Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef3f7;
    --surface: #ffffff;
    --ink: #10202d;
    --muted: #5b6b79;
    --line: #d5dee6;
    --accent: #0b6e8a;
    --up: #1a8a55;
    --down: #c0392f;
    --up-soft: #dff3e8;
    --down-soft: #f9e0dd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1a24; --surface: #142634; --ink: #e6eef4; --muted: #8fa3b3;
      --line: #25404f; --accent: #4fb6d1; --up: #46c98a; --down: #ef7b70;
      --up-soft: #163a2c; --down-soft: #45231f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1a24; --surface: #142634; --ink: #e6eef4; --muted: #8fa3b3;
    --line: #25404f; --accent: #4fb6d1; --up: #46c98a; --down: #ef7b70;
    --up-soft: #163a2c; --down-soft: #45231f;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Figtree", system-ui, sans-serif; font-size: 16px; line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-family: "Bricolage Grotesque", "Figtree", sans-serif; font-size: 28px; margin: 4px 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--up); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    font: inherit; font-size: 15px; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab:focus-visible, .star:focus-visible, .refresh:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .star { font-size: 22px; line-height: 1; background: none; border: 0; cursor: pointer; color: var(--muted); padding: 4px; }
  .star[aria-pressed="true"] { color: #e0a100; }
  .name { font-weight: 600; }
  .sym { color: var(--muted); font-size: 14px; }
  .right { text-align: right; }
  .price { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 19px; }
  .chg { display: inline-block; font-size: 14px; font-weight: 600; padding: 1px 8px; border-radius: 6px; margin-top: 2px; }
  .chg.up { color: var(--up); background: var(--up-soft); }
  .chg.down { color: var(--down); background: var(--down-soft); }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .refresh { font: inherit; font-size: 15px; margin-top: 16px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
  .total { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .total .label { color: var(--muted); font-size: 14px; }
  .total .value { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 28px; }
  .total .hint { color: var(--muted); font-size: 13px; }
  .spark { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .spark svg { display: block; }
  .search { display: flex; gap: 8px; margin-bottom: 8px; }
  .search input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .search button { font: inherit; font-size: 15px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .search input:focus-visible, .search button:focus-visible, .res:focus-visible, .rm:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #results { margin-bottom: 14px; }
  .res { display: flex; width: 100%; justify-content: space-between; align-items: center; font: inherit; font-size: 15px; text-align: left; padding: 10px 12px; margin-bottom: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .msg { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
  .rm { font: inherit; font-size: 13px; margin-top: 6px; padding: 2px 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .hold { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .hold input { width: 96px; font: inherit; font-size: 15px; padding: 4px 8px; margin-left: 6px; text-align: right; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .hold input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .note { margin-top: 18px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>My Crypto Tracker</h1>
  <p class="sub">Check prices and star your favorite coins to keep them handy.</p>

  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Loading…</span></div>

  <div class="total" id="total"></div>

  <div class="search">
    <input id="q" type="search" placeholder="Search any coin, e.g. pepe" aria-label="Search for a coin" autocomplete="off">
    <button id="go">Search</button>
  </div>
  <div id="results" aria-live="polite"></div>

  <div class="tabs" role="group" aria-label="Filter">
    <button class="tab" id="tabAll" aria-pressed="true">All coins</button>
    <button class="tab" id="tabFav" aria-pressed="false">Favorites</button>
  </div>

  <div id="list"></div>

  <button class="refresh" id="refresh">Reload prices</button>
  <p class="note">This is a price viewer only. You can't buy, sell, or store money here.</p>
</main>

<script>
  // 1) The coin list. "id" is the coin's name on CoinGecko.
  var BASE_COINS = [
    { id: "bitcoin",     name: "Bitcoin",  sym: "BTC" },
    { id: "ethereum",    name: "Ethereum", sym: "ETH" },
    { id: "solana",      name: "Solana",   sym: "SOL" },
    { id: "ripple",      name: "XRP",      sym: "XRP" },
    { id: "dogecoin",    name: "Dogecoin", sym: "DOGE" },
    { id: "binancecoin", name: "BNB",      sym: "BNB" },
    { id: "cardano",     name: "Cardano",  sym: "ADA" }
  ];

  // Coins you add through search are saved in the browser and joined to the list.
  var COINS = BASE_COINS.slice();
  var custom = [];
  try { custom = JSON.parse(localStorage.getItem("custom") || "[]") || []; } catch (e) { custom = []; }
  custom.forEach(function (c) {
    if (c && c.id && !COINS.some(function (x) { return x.id === c.id; })) {
      COINS.push({ id: String(c.id), name: String(c.name || c.id), sym: String(c.sym || ""), custom: true });
    }
  });
  function saveCustom() {
    var list = COINS.filter(function (c) { return c.custom; })
      .map(function (c) { return { id: c.id, name: c.name, sym: c.sym }; });
    try { localStorage.setItem("custom", JSON.stringify(list)); } catch (e) {}
  }
  // Text from the internet is never trusted: escape it before putting it in the page.
  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  // 2) Snapshot: shown when live prices can't be loaded (from Forbes, about 17 hours old).
  //    Coins without a snapshot show "Available in live mode".
  var SNAPSHOT = {
    bitcoin:  { usd: 81342.00, usd_24h_change: -0.33 },
    ethereum: { usd: 2633.12,  usd_24h_change: -0.78 },
    solana:   { usd: 110.32,   usd_24h_change: -1.75 },
    ripple:   { usd: 1.41,     usd_24h_change: -1.41 }
  };

  var data = SNAPSHOT;
  var isLive = false;
  var onlyFav = false;
  var favs = [];
  var spark = {}; // 7-day price points per coin, filled after live prices load
  var holds = {}; // how much of each coin you hold, e.g. { bitcoin: 0.5 }

  // 3) Favorites are saved in the browser (the page still works if saving fails).
  try { favs = JSON.parse(localStorage.getItem("favs") || "[]"); } catch (e) { favs = []; }
  function saveFavs() { try { localStorage.setItem("favs", JSON.stringify(favs)); } catch (e) {} }
  try { holds = JSON.parse(localStorage.getItem("holds") || "{}") || {}; } catch (e) { holds = {}; }
  function saveHolds() { try { localStorage.setItem("holds", JSON.stringify(holds)); } catch (e) {} }

  // Portfolio total = sum of (amount held x current price)
  function updateTotal() {
    var sum = 0, any = false;
    COINS.forEach(function (c) {
      var d = data[c.id], h = holds[c.id];
      if (d && h > 0) { sum += d.usd * h; any = true; }
    });
    var hint = any
      ? (isLive ? "Based on live prices" : "Based on snapshot prices, not live")
      : "Type how much you hold under any coin to see your total.";
    document.getElementById("total").innerHTML =
      '<div class="label">Portfolio value</div>' +
      '<div class="value">$' + sum.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</div>' +
      '<div class="hint">' + hint + '</div>';
  }

  // Draws a tiny 7-day line from a list of prices
  function sparkSvg(arr) {
    if (!arr || arr.length < 2) return "";
    var step = Math.max(1, Math.floor(arr.length / 40));
    var pts = [];
    for (var i = 0; i < arr.length; i += step) pts.push(arr[i]);
    pts.push(arr[arr.length - 1]);
    var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
    var range = (max - min) || 1;
    var d = pts.map(function (v, i) {
      var x = i / (pts.length - 1) * 96;
      var y = 24 - (v - min) / range * 22;
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    var color = pts[pts.length - 1] >= pts[0] ? "var(--up)" : "var(--down)";
    return '<div class="spark"><svg viewBox="0 0 96 26" width="96" height="26" role="img" aria-label="7 day price trend">' +
      '<polyline points="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>' +
      '<span class="sym">7d</span></div>';
  }

  // Second, optional request for the 7-day lines. If it fails, the rest of the page still works.
  function loadSpark() {
    var ids = COINS.map(function (c) { return c.id; }).join(",");
    var url = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=" + ids + "&sparkline=true";
    fetch(url)
      .then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); })
      .then(function (list) {
        list.forEach(function (item) {
          if (item.sparkline_in_7d && item.sparkline_in_7d.price) spark[item.id] = item.sparkline_in_7d.price;
        });
        render();
      })
      .catch(function () {});
  }

  function fmtPrice(n) {
    var digits = n >= 100 ? 2 : 4;
    return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: digits });
  }

  function render() {
    updateTotal();
    var box = document.getElementById("list");
    var coins = COINS.filter(function (c) { return !onlyFav || favs.indexOf(c.id) !== -1; });
    if (!coins.length) {
      box.innerHTML = '<div class="empty">No favorites yet. Go to "All coins" and tap ☆ to add one.</div>';
      return;
    }
    var html = "<ul>";
    coins.forEach(function (c) {
      var d = data[c.id];
      var isFav = favs.indexOf(c.id) !== -1;
      var nm = esc(c.name), sy = esc(c.sym), cid = esc(c.id);
      var rm = c.custom ? '<div><button class="rm" data-rm="' + cid + '">Remove</button></div>' : "";
      var star = '<button class="star" data-id="' + cid + '" aria-pressed="' + isFav + '" aria-label="Add or remove ' + nm + ' from favorites">' + (isFav ? "★" : "☆") + '</button>';
      var label = '<div><div class="name">' + nm + '</div><div class="sym">' + sy + '</div></div>';
      if (!d) {
        html += '<li>' + star + label + '<div class="right"><div class="sym">' + (isLive ? "Price unavailable" : "Available in live mode") + '</div>' + rm + '</div></li>';
        return;
      }
      var ch = typeof d.usd_24h_change === "number" ? d.usd_24h_change : 0;
      var cls = ch >= 0 ? "up" : "down";
      var sign = ch >= 0 ? "+" : "";
      var labelWithSpark = label.replace(/<\/div><\/div>$/, '</div>' + sparkSvg(spark[c.id]) + '</div>');
      html += '<li>' + star + labelWithSpark +
        '<div class="right"><div class="price">' + fmtPrice(d.usd) + '</div>' +
        '<span class="chg ' + cls + '">' + sign + ch.toFixed(2) + '% (24h)</span>' +
        '<div class="hold"><label>You hold<input type="text" inputmode="decimal" data-hold="' + cid + '" value="' + (holds[c.id] > 0 ? holds[c.id] : "") + '" placeholder="0" aria-label="Amount of ' + nm + ' you hold"></label></div>' +
        rm + '</div></li>';
    });
    html += "</ul>";
    box.innerHTML = html;
  }

  function setStatus() {
    document.getElementById("dot").className = "dot" + (isLive ? " live" : "");
    document.getElementById("statusText").textContent = isLive
      ? "Live prices (CoinGecko)"
      : "Snapshot prices, not live (Forbes, about 17 hours old)";
  }

  // 4) Try to fetch live prices. If that fails, keep the snapshot.
  function load() {
    document.getElementById("statusText").textContent = "Loading…";
    var ids = COINS.map(function (c) { return c.id; }).join(",");
    var url = "https://api.coingecko.com/api/v3/simple/price?ids=" + ids +
              "&vs_currencies=usd&include_24hr_change=true";
    fetch(url)
      .then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); })
      .then(function (j) {
        var ok = COINS.some(function (c) { return j[c.id] && typeof j[c.id].usd === "number"; });
        if (!ok) throw new Error("shape");
        data = j; isLive = true;
      })
      .catch(function () { data = SNAPSHOT; isLive = false; })
      .then(function () { setStatus(); render(); if (isLive) loadSpark(); });
  }

  document.getElementById("list").addEventListener("click", function (e) {
    var r = e.target.closest(".rm");
    if (r) {
      var rid = r.getAttribute("data-rm");
      COINS = COINS.filter(function (c) { return c.id !== rid; });
      favs = favs.filter(function (f) { return f !== rid; });
      delete holds[rid];
      saveCustom(); saveFavs(); saveHolds(); render();
      return;
    }
    var b = e.target.closest(".star");
    if (!b) return;
    var id = b.getAttribute("data-id");
    var i = favs.indexOf(id);
    if (i === -1) favs.push(id); else favs.splice(i, 1);
    saveFavs(); render();
  });

  document.getElementById("list").addEventListener("input", function (e) {
    var id = e.target.getAttribute("data-hold");
    if (!id) return;
    var v = parseFloat(e.target.value.replace(",", "."));
    holds[id] = v > 0 ? v : 0;
    saveHolds(); updateTotal();
  });

  // Search: ask CoinGecko for coins matching the words typed, then let the person tap one to add it.
  function showResults(items, message) {
    var box = document.getElementById("results");
    box.innerHTML = "";
    if (message) {
      var p = document.createElement("p");
      p.className = "msg";
      p.textContent = message;
      box.appendChild(p);
    }
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.className = "res";
      b.type = "button";
      var left = document.createElement("span");
      left.textContent = it.name + " (" + it.symbol.toUpperCase() + ")";
      var right = document.createElement("span");
      right.textContent = "+ Add";
      b.appendChild(left);
      b.appendChild(right);
      b.addEventListener("click", function () { addCoin(it); });
      box.appendChild(b);
    });
  }

  function addCoin(it) {
    if (COINS.some(function (c) { return c.id === it.id; })) {
      showResults([], it.name + " is already in your list.");
      return;
    }
    COINS.push({ id: it.id, name: it.name, sym: it.symbol.toUpperCase(), custom: true });
    saveCustom();
    document.getElementById("q").value = "";
    showResults([], "");
    load();
  }

  function search() {
    var q = document.getElementById("q").value.trim();
    if (!q) return;
    showResults([], "Searching…");
    fetch("https://api.coingecko.com/api/v3/search?query=" + encodeURIComponent(q))
      .then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); })
      .then(function (j) {
        var items = (j.coins || []).slice(0, 6).filter(function (c) { return c && c.id && c.name && c.symbol; });
        showResults(items, items.length ? "" : "No coins found. Try another name.");
      })
      .catch(function () {
        showResults([], "Search needs a live connection. Open this page from your own link and try again.");
      });
  }
  document.getElementById("go").addEventListener("click", search);
  document.getElementById("q").addEventListener("keydown", function (e) { if (e.key === "Enter") search(); });

  function setTab(fav) {
    onlyFav = fav;
    document.getElementById("tabAll").setAttribute("aria-pressed", String(!fav));
    document.getElementById("tabFav").setAttribute("aria-pressed", String(fav));
    render();
  }
  document.getElementById("tabAll").addEventListener("click", function () { setTab(false); });
  document.getElementById("tabFav").addEventListener("click", function () { setTab(true); });
  document.getElementById("refresh").addEventListener("click", load);

  render();
  load();
</script>
</body>
</html>
